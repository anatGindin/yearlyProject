name: Flutter CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/hamal_transport_app/**'
      - '.github/workflows/flutter_ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./Frontend/hamal_transport_app
        run: flutter pub get
      
      - name: Run tests
        working-directory: ./Frontend/hamal_transport_app
        run: flutter test

  # Second job: Build for Android
  build-android:
    name: Build Android APK
    needs: test  # Only run if tests pass
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Get dependencies
        working-directory: ./Frontend/hamal_transport_app
        run: flutter pub get
      
      - name: Build APK
        working-directory: ./Frontend/hamal_transport_app
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Frontend/hamal_transport_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 60

  # Third job: Build for iOS
  build-ios:
    name: Build iOS IPA
    needs: test  # Only run if tests pass
    runs-on: macos-latest  # iOS builds require macOS
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: ./Frontend/hamal_transport_app
        run: flutter pub get
      
      - name: Build iOS (no codesign)
        working-directory: ./Frontend/hamal_transport_app
        run: flutter build ios --release --no-codesign
      
      # Note: For actual distribution, we need to set up code signing
      # This creates an unsigned build for now
      - name: Create IPA archive
        working-directory: ./Frontend/hamal_transport_app
        run: |
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ../ipa/app-unsigned.ipa Payload
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: Frontend/hamal_transport_app/build/ios/ipa/app-unsigned.ipa
          retention-days: 60
