name: hamal_transport_app
description: "Making the life of Hamal's drivers easier with technology."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  english_words: ^4.0.0
  provider: ^6.1.5
  url_launcher: ^6.1.10
  flex_color_scheme: ^8.0.0
  http: ^1.1.0
  flutter_test:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  shared_preferences: ^2.5.3
  firebase_database: ^12.1.0
  mockito: ^5.6.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  google_fonts: ^7.0.2
  lottie: ^3.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  remove_unused_localizations: ^1.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "Resources/Images/newicon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "Resources/Images/newicon.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - Resources/Images/
    - Resources/Lottie/
    - assets/mock_data.json
