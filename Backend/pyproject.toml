[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["I001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = false
exclude = ["tests/"]
# uncomment gradually as codebase matures:
# warn_return_any = true
# warn_unused_ignores = true
# disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "fastapi.*", "pydantic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]